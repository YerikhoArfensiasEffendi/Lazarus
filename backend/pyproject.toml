[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lazarus-core"
version = "0.1.0"
description = "Lazarus (The Underground Office) — Loyal, honest, adaptive AI agent core, knowledge store, and API."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[project.scripts]
lazarus = "lazarus.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["lazarus"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
