[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lazarus-core"
version = "0.2.0"
description = "Lazarus (The Underground Office) — Loyal, honest, adaptive AI agent core, knowledge store, skill arsenal, and agentic library stack."
requires-python = ">=3.12"
dependencies = [
    # Core API & HTTP
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "uvicorn[standard]>=0.32.0",
    # Top-Rated Agentic Frameworks & MCP
    "anthropic>=0.40.0",
    "browser-use>=0.1.0",
    "crewai>=0.100.0",
    "google-adk>=1.0.0",
    "langgraph>=0.3.0",
    "mcp>=1.6.0",
    "openai>=1.60.0",
    "openai-agents>=0.0.10",
    "pydantic-ai>=0.1.0",
    # Document, Media, Web & Code Editing Toolkit
    "beautifulsoup4>=4.12.0",
    "gitpython>=3.1.40",
    "lxml>=5.3.0",
    "openpyxl>=3.1.0",
    "pillow>=11.0.0",
    "playwright>=1.50.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "python-pptx>=1.0.0",
    "reportlab>=4.2.0",
    "rich>=13.9.0",
    "tree-sitter>=0.24.0",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[project.scripts]
lazarus = "lazarus.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["lazarus"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
